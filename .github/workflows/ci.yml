name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to commits (a moved tag cannot change what runs); Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run ruff check src tests evals scripts
          uv run ruff format --check src tests evals scripts
      - name: Test
        run: uv run pytest -q
